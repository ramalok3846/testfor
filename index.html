<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호랭이닷컴 기출 추출기 (GitHub Pages)</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #ff6b00; /* 호랭이 오렌지 */
            --text-color: #333333;
            --border-color: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        .search-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 560px) {
            .form-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #e05e00;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .result-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #222;
        }

        .result-title a {
            color: inherit;
            text-decoration: none;
        }

        .result-title a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .download-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-dl {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-pdf { background-color: #e74c3c; color: white; }
        .btn-script { background-color: #2ecc71; color: white; }
        .btn-audio { background-color: #3498db; color: white; }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
            font-weight: 500;
            display: none;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #888;
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🐯 호랭이닷컴 기출 추출기</h1>
        <p>조건을 선택하여 필요한 문제지, 대본, MP3 음원을 찾으세요.</p>
    </div>

    <div class="search-card">
        <form id="searchForm" onsubmit="handleSearch(event)">
            <div class="form-grid">
                <!-- 학년 선택 -->
                <div class="form-group">
                    <label for="grade">학년</label>
                    <select id="grade" required>
                        <option value="고3">고3 / N수</option>
                        <option value="고2">고2</option>
                        <option value="고1">고1</option>
                        <option value="중3">중3</option>
                    </select>
                </div>

                <!-- 연도 선택 -->
                <div class="form-group">
                    <label for="year">연도</label>
                    <select id="year" required>
                        <option value="2026">2026년</option>
                        <option value="2025">2025년</option>
                        <option value="2024" selected>2024년</option>
                        <option value="2023">2023년</option>
                        <option value="2022">2022년</option>
                        <option value="2021">2021년</option>
                    </select>
                </div>

                <!-- 월 선택 -->
                <div class="form-group">
                    <label for="month">시행월</label>
                    <select id="month" required>
                        <option value="3월">3월</option>
                        <option value="4월">4월</option>
                        <option value="6월" selected>6월 (모평)</option>
                        <option value="7월">7월</option>
                        <option value="9월">9월 (모평)</option>
                        <option value="10월">10월</option>
                        <option value="11월">11월 (수능)</option>
                    </select>
                </div>

                <!-- 과목 선택 -->
                <div class="form-group">
                    <label for="subject">과목</label>
                    <select id="subject" required>
                        <option value="영어" selected>영어</option>
                        <option value="국어">국어</option>
                        <option value="수학">수학</option>
                        <option value="한국사">한국사</option>
                        <option value="사회탐구">사회탐구</option>
                        <option value="과학탐구">과학탐구</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">🔍 자료 검색하기</button>
        </form>
    </div>

    <div id="loading" class="loading">
        ⏳ 호랭이닷컴에서 자료를 탐색 중입니다... (약 3~5초 소요)
    </div>

    <div id="results" class="results-container">
        <!-- 검색 결과 출력 영역 -->
    </div>
</div>

<script>
    // CORS 우회용 공용 프록시 API (https 통신 지원)
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";
    const BASE_URL = "https://www.horang2.com";

    async function handleSearch(event) {
        event.preventDefault();

        const grade = document.getElementById('grade').value;
        const year = document.getElementById('year').value;
        const month = document.getElementById('month').value;
        const subject = document.getElementById('subject').value;

        // 검색어 구성 (예: "2024년 고3 6월 영어")
        const searchQuery = `${year}년 ${grade} ${month} ${subject}`;

        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        loading.style.display = 'block';
        results.innerHTML = '';

        try {
            // 1. 호랭이닷컴 검색 페이지 요청 (CORS Proxy 경유)
            const searchTargetUrl = `${BASE_URL}/search?q=${encodeURIComponent(searchQuery)}`;
            const response = await fetch(CORS_PROXY + encodeURIComponent(searchTargetUrl));
            
            if (!response.ok) throw new Error("네트워크 응답 실패");

            const htmlText = await response.text();
            
            // DOMParser를 사용해 HTML 문자열을 DOM 객체로 파싱
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, "text/html");

            // 2. 검색 결과 게시물 목록 추출
            const links = Array.from(doc.querySelectorAll("a"))
                .filter(a => a.href && (a.href.includes("/board") || a.href.includes("article") || a.href.includes("post") || a.textContent.includes(subject)))
                .slice(0, 5); // 상위 5개 결과

            if (links.length === 0) {
                loading.style.display = 'none';
                results.innerHTML = '<div class="empty-msg">검색 결과가 없습니다. 조건을 확인해주세요.</div>';
                return;
            }

            // 3. 각 게시글 상세 페이지에 들어가 파일 링크(PDF, MP3, 대본) 수집
            const items = [];
            
            for (let link of links) {
                let postHref = link.getAttribute("href");
                if (!postHref) continue;

                let postUrl = postHref.startsWith("http") ? postHref : BASE_URL + postHref;
                let title = link.textContent.trim() || searchQuery;

                try {
                    const postRes = await fetch(CORS_PROXY + encodeURIComponent(postUrl));
                    const postHtml = await postRes.text();
                    const postDoc = parser.parseFromString(postHtml, "text/html");

                    const files = { pdf: [], script: [], audio: [] };

                    // 게시글 내부 다운로드/첨부파일 링크 수집
                    const fileLinks = postDoc.querySelectorAll("a[href]");

                    fileLinks.forEach(f => {
                        const fileHref = f.getAttribute("href") || "";
                        const fileName = f.textContent.trim() || "다운로드";
                        let fullFileUrl = fileHref.startsWith("http") ? fileHref : BASE_URL + fileHref;

                        const lowerHref = fileHref.toLowerCase();
                        const lowerName = fileName.toLowerCase();

                        if (lowerHref.includes(".mp3") || lowerName.includes("듣기") || lowerName.includes("음원")) {
                            files.audio.push({ name: fileName, url: fullFileUrl });
                        } else if (lowerName.includes("대본") || lowerName.includes("script") || lowerName.includes("txt")) {
                            files.script.push({ name: fileName, url: fullFileUrl });
                        } else if (lowerHref.includes(".pdf") || lowerHref.includes(".hwp") || lowerName.includes("문제") || lowerName.includes("정답")) {
                            files.pdf.push({ name: fileName, url: fullFileUrl });
                        }
                    });

                    items.push({ title, postUrl, files });
                } catch (e) {
                    console.error("게시글 파싱 실패:", postUrl, e);
                }
            }

            loading.style.display = 'none';
            renderResults(items);

        } catch (error) {
            loading.style.display = 'none';
            results.innerHTML = `
                <div class="empty-msg">
                    ❌ 자료를 가져오지 못했습니다.<br>
                    CORS 우회 서버 응답이 지연되거나 호랭이닷컴 검색 구조 변경일 수 있습니다.
                </div>
            `;
            console.error(error);
        }
    }

    function renderResults(items) {
        const results = document.getElementById('results');

        if (!items || items.length === 0) {
            results.innerHTML = '<div class="empty-msg">일치하는 자료를 찾지 못했습니다.</div>';
            return;
        }

        items.forEach(item => {
            let linksHtml = '';

            // PDF (문제/정답)
            if (item.files.pdf && item.files.pdf.length > 0) {
                item.files.pdf.forEach(f => {
                    linksHtml += `<a href="${f.url}" target="_blank" rel="noopener noreferrer" class="btn-dl btn-pdf">📌 ${f.name}</a>`;
                });
            }

            // 영어 대본 (Script)
            if (item.files.script && item.files.script.length > 0) {
                item.files.script.forEach(f => {
                    linksHtml += `<a href="${f.url}" target="_blank" rel="noopener noreferrer" class="btn-dl btn-script">📝 ${f.name}</a>`;
                });
            }

            // 영어 MP3 음원
            if (item.files.audio && item.files.audio.length > 0) {
                item.files.audio.forEach(f => {
                    linksHtml += `<a href="${f.url}" target="_blank" rel="noopener noreferrer" class="btn-dl btn-audio">🎧 ${f.name}</a>`;
                });
            }

            results.innerHTML += `
                <div class="result-item">
                    <div class="result-title">
                        <a href="${item.postUrl}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                    </div>
                    <div class="download-links">
                        ${linksHtml || '<span style="color:#888; font-size:0.9rem;">이 게시물에는 직관적인 파일 링크가 없거나 본문 확인이 필요합니다.</span>'}
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
