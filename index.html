<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호랭이닷컴 기출 추출기</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #ff6b00;
            --text-color: #333333;
            --border-color: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .search-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 560px) {
            .form-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .result-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .result-title a {
            color: #222;
            text-decoration: none;
        }

        .download-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-dl {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }

        .btn-pdf { background-color: #e74c3c; color: white; }
        .btn-script { background-color: #2ecc71; color: white; }
        .btn-audio { background-color: #3498db; color: white; }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
            font-weight: 500;
            display: none;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #888;
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🐯 호랭이닷컴 기출 추출기</h1>
        <p>조건 선택 후 검색 버튼을 누르세요.</p>
    </div>

    <div class="search-card">
        <form id="searchForm" onsubmit="handleSearch(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="grade">학년</label>
                    <select id="grade" required>
                        <option value="고3">고3 / N수</option>
                        <option value="고2">고2</option>
                        <option value="고1">고1</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="year">연도</label>
                    <select id="year" required>
                        <option value="2026">2026년</option>
                        <option value="2025">2025년</option>
                        <option value="2024" selected>2024년</option>
                        <option value="2023">2023년</option>
                        <option value="2022">2022년</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="month">시행월</label>
                    <select id="month" required>
                        <option value="3월">3월</option>
                        <option value="4월">4월</option>
                        <option value="6월" selected>6월</option>
                        <option value="7월">7월</option>
                        <option value="9월">9월</option>
                        <option value="10월">10월</option>
                        <option value="11월">11월</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject">과목</label>
                    <select id="subject" required>
                        <option value="영어" selected>영어</option>
                        <option value="국어">국어</option>
                        <option value="수학">수학</option>
                        <option value="한국사">한국사</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-submit">🔍 자료 검색하기</button>
        </form>
    </div>

    <div id="loading" class="loading">
        ⏳ 호랭이닷컴에서 자료를 검색 중입니다...
    </div>

    <div id="results" class="results-container"></div>
</div>

<script>
    // 차단율이 낮고 신뢰도가 높은 CORS 프록시 URL
    const PROXY_URL = "https://corsproxy.io/?";
    const BASE_URL = "https://www.horang2.com";

    async function handleSearch(event) {
        event.preventDefault();

        const grade = document.getElementById('grade').value;
        const year = document.getElementById('year').value;
        const month = document.getElementById('month').value;
        const subject = document.getElementById('subject').value;

        const searchQuery = `${year}년 ${grade} ${month} ${subject}`;
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        loading.style.display = 'block';
        results.innerHTML = '';

        try {
            const targetSearchUrl = `${BASE_URL}/search?q=${encodeURIComponent(searchQuery)}`;
            
            // corsproxy.io 경유 요청
            const response = await fetch(PROXY_URL + encodeURIComponent(targetSearchUrl));
            
            if (!response.ok) {
                throw new Error(`상태 코드: ${response.status}`);
            }

            const htmlText = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, "text/html");

            // 게시글 링크 수집
            const rawLinks = Array.from(doc.querySelectorAll("a"));
            const validLinks = rawLinks.filter(a => {
                const href = a.getAttribute("href") || "";
                return href.includes("board") || href.includes("article") || href.includes("view") || href.includes("post");
            }).slice(0, 5);

            if (validLinks.length === 0) {
                loading.style.display = 'none';
                results.innerHTML = `<div class="empty-msg">"${searchQuery}" 검색 결과가 없습니다.</div>`;
                return;
            }

            const items = [];

            for (let link of validLinks) {
                let href = link.getAttribute("href");
                let postUrl = href.startsWith("http") ? href : BASE_URL + href;
                let title = link.textContent.trim() || searchQuery;

                try {
                    const postRes = await fetch(PROXY_URL + encodeURIComponent(postUrl));
                    const postHtml = await postRes.text();
                    const postDoc = parser.parseFromString(postHtml, "text/html");

                    const files = { pdf: [], script: [], audio: [] };
                    const fileElements = postDoc.querySelectorAll("a[href]");

                    fileElements.forEach(f => {
                        const fileHref = f.getAttribute("href") || "";
                        const fileName = f.textContent.trim() || "파일 다운로드";
                        let fullFileUrl = fileHref.startsWith("http") ? fileHref : BASE_URL + fileHref;

                        const lowerHref = fileHref.toLowerCase();
                        const lowerName = fileName.toLowerCase();

                        if (lowerHref.includes(".mp3") || lowerName.includes("듣기") || lowerName.includes("음원")) {
                            files.audio.push({ name: fileName, url: fullFileUrl });
                        } else if (lowerName.includes("대본") || lowerName.includes("script") || lowerName.includes("txt")) {
                            files.script.push({ name: fileName, url: fullFileUrl });
                        } else if (lowerHref.includes(".pdf") || lowerHref.includes(".hwp") || lowerName.includes("문제") || lowerName.includes("정답")) {
                            files.pdf.push({ name: fileName, url: fullFileUrl });
                        }
                    });

                    items.push({ title, postUrl, files });
                } catch (err) {
                    console.error("게시글 파싱 에러:", err);
                }
            }

            loading.style.display = 'none';
            renderResults(items);

        } catch (error) {
            loading.style.display = 'none';
            results.innerHTML = `
                <div class="empty-msg">
                    ❌ 자료를 가져오지 못했습니다.<br>
                    (${error.message})<br><br>
                    호랭이닷컴 검색 시스템이 차단되었거나 점검 중일 수 있습니다.
                </div>
            `;
        }
    }

    function renderResults(items) {
        const results = document.getElementById('results');

        if (!items || items.length === 0) {
            results.innerHTML = '<div class="empty-msg">검색된 자료가 없습니다.</div>';
            return;
        }

        items.forEach(item => {
            let linksHtml = '';

            if (item.files.pdf) {
                item.files.pdf.forEach(f => {
                    linksHtml += `<a href="${f.url}" target="_blank" rel="noopener noreferrer" class="btn-dl btn-pdf">📌 ${f.name}</a> `;
                });
            }
            if (item.files.script) {
                item.files.script.forEach(f => {
                    linksHtml += `<a href="${f.url}" target="_blank" rel="noopener noreferrer" class="btn-dl btn-script">📝 ${f.name}</a> `;
                });
            }
            if (item.files.audio) {
                item.files.audio.forEach(f => {
                    linksHtml += `<a href="${f.url}" target="_blank" rel="noopener noreferrer" class="btn-dl btn-audio">🎧 ${f.name}</a> `;
                });
            }

            results.innerHTML += `
                <div class="result-item">
                    <div class="result-title">
                        <a href="${item.postUrl}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                    </div>
                    <div class="download-links">
                        ${linksHtml || '<span style="color:#888; font-size:0.9rem;">게시글 내 직접 다운로드 링크가 없습니다. 위 제목을 클릭해 직접 확인하세요.</span>'}
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
